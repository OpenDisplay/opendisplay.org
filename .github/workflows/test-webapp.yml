name: Web App tests

# Runs the OD App suite on app changes AND on any shared-runtime change —
# the shared-dependency compatibility contract (DESIGN_WEB_OD_APP_PLAN.md §2).
on:
  push:
    branches: [main]
    paths:
      - "httpdocs/app/**"
      - "tests/webapp/**"
      - "httpdocs/js/ble-common.js"
      - "httpdocs/js/pako.js"
      - "httpdocs/js/js-yaml.min.js"
      - "httpdocs/js/opendisplay-msd.js"
      - "httpdocs/firmware/toolbox/config.yaml"
      - ".github/workflows/test-webapp.yml"
  pull_request:
    paths:
      - "httpdocs/app/**"
      - "tests/webapp/**"
      - "httpdocs/js/ble-common.js"
      - "httpdocs/js/pako.js"
      - "httpdocs/js/js-yaml.min.js"
      - "httpdocs/js/opendisplay-msd.js"
      - "httpdocs/firmware/toolbox/config.yaml"
      - ".github/workflows/test-webapp.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # CI=true makes the real-browser round-trip mandatory (the ubuntu-latest
      # image ships google-chrome; the suite fails rather than skips without it).
      - name: Run webapp test suite (browser proof required)
        run: node --test tests/webapp/

  immutable-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Released v<N>/ directories are immutable: any production asset change
      # requires a new version directory (DESIGN_WEB_OD_APP_PLAN.md §2).
      - name: Reject changes to released app version directories
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Read the released list from the BASE commit: a PR that edits the
          # manifest while touching a released dir must not be able to unlock
          # itself, and a release PR that adds vN to the manifest can still
          # make vN's final changes in the same PR.
          released_raw="$(git show "${base}:httpdocs/app/RELEASED_VERSIONS" 2>/dev/null || true)"
          mapfile -t released < <(grep -E '^v[0-9]+$' <<< "$released_raw" || true)
          [[ ${#released[@]} -eq 0 ]] && { echo "no released versions in base manifest"; exit 0; }
          changed="$(git diff --name-only "$base" "$head")"
          fail=0
          for v in "${released[@]}"; do
            if grep -q "^httpdocs/app/${v}/" <<< "$changed"; then
              echo "::error::httpdocs/app/${v}/ is a RELEASED, immutable version — create a new version directory instead:"
              grep "^httpdocs/app/${v}/" <<< "$changed" >&2
              fail=1
            fi
          done
          exit "$fail"
