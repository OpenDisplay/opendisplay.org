name: Validate Simple Config

on:
  pull_request:
    paths:
      - 'httpdocs/firmware/toolbox/simple-config-presets.json'
      - 'httpdocs/firmware/toolbox/simple-config-id-registry.json'
      - 'httpdocs/firmware/toolbox/bin/**'
      - 'httpdocs/firmware/toolbox/firmware/**'
      - '.github/scripts/validate-simple-config-presets.py'
      - '.github/workflows/validate-simple-config.yml'
  push:
    branches: [main]
    paths:
      - 'httpdocs/firmware/toolbox/simple-config-presets.json'
      - 'httpdocs/firmware/toolbox/simple-config-id-registry.json'
      - 'httpdocs/firmware/toolbox/bin/**'
      - 'httpdocs/firmware/toolbox/firmware/**'
      - '.github/scripts/validate-simple-config-presets.py'
      - '.github/workflows/validate-simple-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'OpenDisplay/opendisplay.org'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve base registry
        id: base
        run: |
          set -euo pipefail
          mkdir -p /tmp/simple-config-base
          BASE_REF=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE_REF="${{ github.event.before }}"
          else
            BASE_REF="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          OUT="/tmp/simple-config-base/simple-config-id-registry.json"
          if [ -n "$BASE_REF" ] && git cat-file -e "${BASE_REF}:httpdocs/firmware/toolbox/simple-config-id-registry.json" 2>/dev/null; then
            git show "${BASE_REF}:httpdocs/firmware/toolbox/simple-config-id-registry.json" > "$OUT"
            echo "path=$OUT" >> "$GITHUB_OUTPUT"
            echo "Using base registry from $BASE_REF"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No base registry found (first introduction or shallow history)"
          fi

      - name: Validate simple-config presets
        run: |
          set -euo pipefail
          ARGS=(--repo-root "$GITHUB_WORKSPACE")
          if [ -n "${{ steps.base.outputs.path }}" ]; then
            ARGS+=(--base-registry "${{ steps.base.outputs.path }}")
          fi
          python3 .github/scripts/validate-simple-config-presets.py "${ARGS[@]}"
