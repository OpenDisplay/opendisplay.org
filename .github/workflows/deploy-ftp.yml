name: Deploy to FTP

on:
  # Called by release-please.yml once it has created a release. Needed because a
  # release created with GITHUB_TOKEN does not emit `release: published`.
  workflow_call:
    inputs:
      tag:
        description: "Tag to deploy"
        required: true
        type: string
  # Kept for releases published by hand in the GitHub UI, and for manual redeploys.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (leave empty to deploy the current branch)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # A release must never publish code whose tests were not run. The webapp
  # suite is path-filtered on PRs, so this is the only place that guarantees it
  # runs against the exact tree being deployed.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
      - name: Run webapp test suite
        env:
          OD_QR_DECODE_TEST: "1"
        run: node --test tests/webapp/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          # Under workflow_call the default ref is the caller's (main), which is
          # not what we want to publish — pin to the tag being released.
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Deploy httpdocs to FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: .github/scripts/deploy-ftp-curl.sh
